name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: round-seeker-309101
  REGION: us-central1
  CLUSTER: ecommerce
  AR: us-central1-docker.pkg.dev/round-seeker-309101/ecommerce
  WIF: projects/741064653110/locations/global/workloadIdentityPools/github/providers/github
  SA: github-deploy@round-seeker-309101.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
      INTERNAL_SERVICE_TOKEN: dev-internal-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: lint + build
        run: npm run build

      - name: test + coverage (gate 80%, 90-95% en motor/cupones)
        run: npm run test:coverage

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF }}
          service_account: ${{ env.SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -f apps/backend/Dockerfile -t "$AR/backend:${{ github.sha }}" -t "$AR/backend:latest" .
          docker build -f apps/frontend/Dockerfile -t "$AR/frontend:${{ github.sha }}" -t "$AR/frontend:latest" .
          docker build -f apps/backend/services/discount-service/Dockerfile -t "$AR/discount-service:${{ github.sha }}" -t "$AR/discount-service:latest" .
          docker build -t "$AR/catalog-service:${{ github.sha }}" -t "$AR/catalog-service:latest" apps/backend/services/catalog-service
          docker build -f apps/backend/services/coupon-service/Dockerfile -t "$AR/coupon-service:${{ github.sha }}" -t "$AR/coupon-service:latest" .
          docker build -f apps/backend/services/order-service/Dockerfile -t "$AR/order-service:${{ github.sha }}" -t "$AR/order-service:latest" .
          docker build -f apps/backend/services/notification-service/Dockerfile -t "$AR/notification-service:${{ github.sha }}" -t "$AR/notification-service:latest" .
          docker build -f apps/backend/services/api-gateway/Dockerfile -t "$AR/api-gateway:${{ github.sha }}" -t "$AR/api-gateway:latest" .
          docker push "$AR/backend:${{ github.sha }}"
          docker push "$AR/backend:latest"
          docker push "$AR/frontend:${{ github.sha }}"
          docker push "$AR/frontend:latest"
          docker push "$AR/discount-service:${{ github.sha }}"
          docker push "$AR/discount-service:latest"
          docker push "$AR/catalog-service:${{ github.sha }}"
          docker push "$AR/catalog-service:latest"
          docker push "$AR/coupon-service:${{ github.sha }}"
          docker push "$AR/coupon-service:latest"
          docker push "$AR/order-service:${{ github.sha }}"
          docker push "$AR/order-service:latest"
          docker push "$AR/notification-service:${{ github.sha }}"
          docker push "$AR/notification-service:latest"
          docker push "$AR/api-gateway:${{ github.sha }}"
          docker push "$AR/api-gateway:latest"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT }}

      - name: Ensure shared service secrets exist
        run: |
          kubectl create namespace ecommerce --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n ecommerce create secret generic service-secrets \
            --from-literal=internal-service-token="${{ secrets.INTERNAL_SERVICE_TOKEN || 'dev-internal-token' }}" \
            --from-literal=coupon-database-url="${{ secrets.CATALOG_DATABASE_URL }}" \
            --from-literal=coupon-direct-url="${{ secrets.CATALOG_DIRECT_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          if [ -n "${{ secrets.INTERNAL_SERVICE_TOKEN }}" ]; then
            kubectl -n ecommerce create secret generic internal-token \
              --from-literal=value="${{ secrets.INTERNAL_SERVICE_TOKEN }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          if [ -n "${{ secrets.CATALOG_DATABASE_URL }}" ]; then
            DIRECT_URL="${{ secrets.CATALOG_DIRECT_URL }}"
            if [ -z "$DIRECT_URL" ]; then DIRECT_URL="${{ secrets.CATALOG_DATABASE_URL }}"; fi
            kubectl -n ecommerce create secret generic catalog-service-secrets \
              --from-literal=DATABASE_URL="${{ secrets.CATALOG_DATABASE_URL }}" \
              --from-literal=DIRECT_URL="$DIRECT_URL" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          if [ -n "${{ secrets.ORDER_DATABASE_URL }}" ]; then
            ORDER_DIRECT_URL="${{ secrets.ORDER_DIRECT_URL }}"
            if [ -z "$ORDER_DIRECT_URL" ]; then ORDER_DIRECT_URL="${{ secrets.ORDER_DATABASE_URL }}"; fi
            kubectl -n ecommerce create secret generic order-service-secrets \
              --from-literal=DATABASE_URL="${{ secrets.ORDER_DATABASE_URL }}" \
              --from-literal=DIRECT_URL="$ORDER_DIRECT_URL" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi
          kubectl -n ecommerce create secret generic api-gateway-secrets \
            --from-literal=ADMIN_API_TOKEN="${{ secrets.ADMIN_API_TOKEN || 'dev-admin-token' }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply and rollout
        run: |
          kubectl apply -f k8s/gke.yaml
          kubectl apply -f k8s/redis.yaml
          kubectl apply -f k8s/discount-service.yaml
          kubectl apply -f k8s/catalog-service.yaml
          kubectl apply -f k8s/notification-service.yaml
          kubectl apply -f k8s/api-gateway.yaml
          kubectl -n ecommerce set image deployment/backend backend="$AR/backend:${{ github.sha }}"
          kubectl -n ecommerce set image deployment/frontend frontend="$AR/frontend:${{ github.sha }}"
          kubectl -n ecommerce set image deployment/discount-service discount-service="$AR/discount-service:${{ github.sha }}"
          kubectl -n ecommerce set image deployment/catalog-service catalog-service="$AR/catalog-service:${{ github.sha }}"
          kubectl -n ecommerce set image deployment/coupon-service coupon-service="$AR/coupon-service:${{ github.sha }}"
          kubectl -n ecommerce set image deployment/notification-service notification-service="$AR/notification-service:${{ github.sha }}"
          kubectl -n ecommerce set image deployment/api-gateway api-gateway="$AR/api-gateway:${{ github.sha }}"
          kubectl -n ecommerce rollout status deployment/backend --timeout=180s
          kubectl -n ecommerce rollout status deployment/frontend --timeout=180s
          kubectl -n ecommerce rollout status deployment/redis --timeout=180s
          kubectl -n ecommerce rollout status deployment/discount-service --timeout=180s
          kubectl -n ecommerce rollout status deployment/catalog-service --timeout=180s
          kubectl -n ecommerce rollout status deployment/coupon-service --timeout=180s
          kubectl -n ecommerce rollout status deployment/notification-service --timeout=180s
          kubectl -n ecommerce rollout status deployment/api-gateway --timeout=180s
          if [ -n "${{ secrets.ORDER_DATABASE_URL }}" ]; then
            kubectl apply -f k8s/order-service.yaml
            kubectl -n ecommerce set image deployment/order-service order-service="$AR/order-service:${{ github.sha }}"
            kubectl -n ecommerce rollout status deployment/order-service --timeout=180s
          else
            echo "ORDER_DATABASE_URL missing; skipping order-service rollout"
          fi

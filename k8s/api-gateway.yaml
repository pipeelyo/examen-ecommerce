apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: us-central1-docker.pkg.dev/round-seeker-309101/ecommerce/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: CATALOG_SERVICE_URL
              value: http://catalog-service:3002
            - name: COUPON_SERVICE_URL
              value: http://coupon-service:3003
            - name: DISCOUNT_SERVICE_URL
              value: http://discount-service:3001
            - name: ORDER_SERVICE_URL
              value: http://order-service:3004
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-token
                  key: value
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: api-gateway-secrets
                  key: ADMIN_API_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecommerce
spec:
  # ClusterIP: la unica salida publica del cluster sigue siendo el Service
  # "frontend" (LoadBalancer); su nginx reenvia /api/v1/* hacia aqui.
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP

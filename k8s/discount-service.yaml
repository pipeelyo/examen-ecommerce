apiVersion: apps/v1
kind: Deployment
metadata:
  name: discount-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discount-service
  template:
    metadata:
      labels:
        app: discount-service
    spec:
      containers:
        - name: discount-service
          image: us-central1-docker.pkg.dev/round-seeker-309101/ecommerce/discount-service:98d36cb-2
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-token
                  key: value
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: discount-service
  namespace: ecommerce
spec:
  selector:
    app: discount-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP

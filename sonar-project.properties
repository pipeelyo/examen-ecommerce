# SonarCloud (sonarcloud.io) — analisis estatico + cobertura del monorepo.
#
# projectKey y organization los asigna SonarCloud al crear el proyecto
# (Import from GitHub). Reemplaza los dos valores de abajo por los reales
# antes del primer analisis — con estos placeholders el scan falla.
sonar.projectKey=pipeelyo_examen-ecommerce
sonar.organization=pipeelyo

sonar.projectName=Core E-Commerce (Kata E1)
sonar.sourceEncoding=UTF-8

# Los tests van adentro de sonar.sources (colocados como *.test.ts en
# algunos paquetes, en test/unit/ en los microservicios) — sonar.test.inclusions
# abajo los reclasifica como codigo de test, no hace falta un sonar.tests
# separado (y evita el conflicto de rutas superpuestas).
sonar.sources=\
  apps/backend/src,\
  apps/backend/services/api-gateway/src,\
  apps/backend/services/api-gateway/test,\
  apps/backend/services/catalog-service/src,\
  apps/backend/services/catalog-service/test,\
  apps/backend/services/coupon-service/src,\
  apps/backend/services/coupon-service/test,\
  apps/backend/services/discount-service/src,\
  apps/backend/services/discount-service/test,\
  apps/backend/services/notification-service/src,\
  apps/backend/services/notification-service/test,\
  apps/backend/services/order-service/src,\
  apps/backend/services/order-service/test,\
  apps/frontend/src,\
  packages/discount-engine/src,\
  packages/shared-contracts/src

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# node_modules/dist/coverage ya estan implicitos por defecto, pero el
# cliente de Prisma generado y las migraciones no aportan nada al analisis.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/generated/**,\
  **/prisma/migrations/**,\
  **/*.d.ts

sonar.javascript.lcov.reportPaths=\
  apps/backend/coverage/lcov.info,\
  apps/backend/services/api-gateway/coverage/lcov.info,\
  apps/backend/services/catalog-service/coverage/lcov.info,\
  apps/backend/services/coupon-service/coverage/lcov.info,\
  apps/backend/services/discount-service/coverage/lcov.info,\
  apps/backend/services/notification-service/coverage/lcov.info,\
  apps/backend/services/order-service/coverage/lcov.info,\
  apps/frontend/coverage/lcov.info,\
  packages/discount-engine/coverage/lcov.info
sonar.typescript.lcov.reportPaths=${sonar.javascript.lcov.reportPaths}
